<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Array SMK RPL</title>
    <style>
        /* Membuat isi halaman ke tengah secara vertikal & horizontal */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Tinggi minimal seukuran layar browser */
            background-color: #e9ecef; 
        }

        .container { 
            width: 90%;
            max-width: 800px; 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center; /* Tulisan di dalam kontainer jadi rata tengah */
        }

        /* Memperbesar ukuran teks */
        h2 { font-size: 3rem; color: #333; margin-bottom: 30px; }
        h3 { font-size: 1.8rem; color: #007bff; }
        p { font-size: 1.3rem; color: #555; }
        
        code { 
            background: #f8f9fa; 
            padding: 5px 10px; 
            border-radius: 5px; 
            font-size: 1.4rem; 
            color: #d63384; 
            display: inline-block;
            margin: 5px 0;
        }

        button { 
            padding: 20px 40px; 
            font-size: 1.5rem; 
            font-weight: bold;
            margin: 20px 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 10px; 
            background: #007bff; 
            color: white; 
            transition: transform 0.2s, background 0.2s;
        }

        button:hover { 
            background: #0056b3; 
            transform: scale(1.05); /* Efek membesar sedikit saat kursor lewat */
        }

        hr { border: 0; height: 2px; background: #eee; margin: 40px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Demo Array 1D & 2D</h2>
        
        <hr>

        <h3>1. Array 1 Dimensi (Daftar Siswa)</h3>
        <p>Struktur: <code>["Budi", "Siti", "Andi", "Ani"]</code></p>
        <button onclick="aksesArray1D()">Coba Akses 1D</button>

        <hr>

        <h3>2. Array 2 Dimensi (Denah Kelas)</h3>
        <p>Struktur: Tabel 3 Baris x 2 Kolom</p>
        <div>
            <code>["Budi", "Siti"]</code><br>
            <code>["Andi", "Ani"]</code><br>
            <code>["Eko", "Rina"]</code>
        </div>
              
        <button onclick="aksesArray2D()">Coba Akses 2D</button>
    </div>

    <script>
        // --- DATA ARRAY ---
        let siswa = ["Budi", "Siti", "Andi", "Ani"];

        let denahKelas = [
            ["Budi", "Siti"],   // Baris index 0
            ["Andi", "Ani"],   // Baris index 1
            ["Eko", "Rina"]     // Baris index 2
        ];

        console.log("--- Data Array 1D ---");
        console.log(siswa);
        
        console.log("--- Data Array 2D (Tabel) ---");
        console.table(denahKelas);

        // --- FUNGSI AKSES ---
        function aksesArray1D() {
            let index = prompt("Masukkan nomor index siswa (0-3):");
            if (index !== null && index !== "") {
                if (index >= 0 && index < siswa.length) {
                    alert("Siswa pada index ke-" + index + " adalah: " + siswa[index]);
                } else {
                    alert("Ups! Index salah. Masukkan angka 0 sampai " + (siswa.length - 1));
                }
            }
        }

        function aksesArray2D() {
            alert("Kita akan mencari posisi duduk. Masukkan Baris dan Kolom.");
            let baris = prompt("Masukkan nomor BARIS (0-2):");
            let kolom = prompt("Masukkan nomor KOLOM (0-1):");

            if (baris !== null && kolom !== "") {
                if (denahKelas[baris] && denahKelas[baris][kolom]) {
                    let hasil = denahKelas[baris][kolom];
                    alert("Hasil: Baris " + baris + ", Kolom " + kolom + " adalah " + hasil);
                } else {
                    alert("Data tidak ditemukan! Cek lagi nomor baris/kolomnya.");
                }
            }
        }
    </script>
</body>
</html>
